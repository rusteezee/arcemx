name: Daily Market Analysis

on:
  schedule:
    # PRIMARY run. 02:50 UTC Mon-Fri = 08:20 IST, ten minutes BEFORE the
    # bot's 08:30 dispatch, so this is the authoritative daily row and
    # the bot's 08:30 path sees it fresh via run_if_stale and skips.
    # run_if_stale keeps it idempotent against the secondary cron + bot
    # dispatch below.
    - cron: "50 2 * * 1-5"
    # SECONDARY fallback. 03:13 UTC = 08:43 IST. Covers the case where
    # the 08:20 primary drifted or skipped (GitHub free-tier cron fired
    # ~4h late on 09/06/2026 and not at all on 10/06/2026). Still
    # run_if_stale-guarded so it no-ops when the primary already wrote.
    - cron: "13 3 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Force a fresh analysis even if a recent one already exists.
          Leave unchecked for automated dispatches (Cloudflare Worker,
          bot's own scheduler) so they respect the same staleness check
          as the scheduled triggers above - root-caused 2026-08-28: with
          no force flag, EVERY workflow_dispatch unconditionally force-ran
          and pushed, and when the Cloudflare Worker, the bot, and a
          manual recovery dispatch all fired within the same hour (plus
          both native schedule crons finally landing ~12h late), 5
          separate runs pushed 5 separate Telegram messages the same day.
          Check this box (or pass -f force=true via gh CLI) only when you
          specifically want a guaranteed-fresh run regardless of
          staleness, e.g. recovering a confirmed missed morning.
        required: false
        default: false
        type: boolean

# Opt every JavaScript action onto Node 24 ahead of the 16 June 2026
# forced-migration deadline. actions/checkout@v4 and actions/setup-python@v5
# still ship as Node 20 bundles in their current major; this env var tells
# the runner to execute them under Node 24 instead. Removes the looming
# break without bumping action major versions (which is a separate, larger
# audit). Drop this var once we move to Node-24-native action releases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # HuggingFace model cache for Qwen3-Embedding-0.6B (~1.2 GB).
      # Phase 1 RAG retrieval inside feedback.build_feedback() embeds
      # today's tape state at call time; without this cache every
      # morning run would re-download the model, eating ~90 s wall
      # clock and ~2 GB egress.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements-embed.txt') }}
      - name: Install (analyzer + embed for Phase 1 retrieval)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-embed.txt
      - name: Run aggregator (skips when the bot already ran this morning)
        id: agg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          # Reddit's own OAuth app approval is gated shut (Responsible
          # Builder Policy, confirmed live 2026-08-28) - REDDIT_CLIENT_ID/
          # SECRET above stay wired as a dormant fallback, but Apify is the
          # real path now. See fetchers/reddit.py.
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          # RAG Phase 1 (blueprint 14): activated 2026-07-16 after the full
          # re-embed under one model (bge-base-en-v1.5) confirmed clean via
          # a live match_exemplars probe. Rollback = flip this to "0".
          RAG_PHASE1_ENABLED: "1"
          # Only an EXPLICIT force=true input runs unconditionally now
          # (see the workflow_dispatch.inputs.force description above for
          # why - this used to be "any workflow_dispatch", which caused a
          # real 5-messages-in-one-day incident 2026-08-28). Everything
          # else, including a plain workflow_dispatch with no inputs (the
          # default from the Cloudflare Worker and the bot's own
          # scheduler), defers to run_if_stale like the schedule triggers.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          python - <<'EOF'
          import os
          from analyzer.aggregator import run, run_if_stale
          if os.getenv("FORCE_RUN") == "true":
              res = run()
          else:
              res = run_if_stale(max_age_minutes=90)
          ran = res is not None and not (res or {}).get("error")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ran={'true' if ran else 'false'}\n")
          EOF
      - name: Push to Telegram
        # Only when THIS workflow produced the analysis. When the bot's
        # 08:30 run produced it, the bot already pushed the daily call.
        if: steps.agg.outputs.ran == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.daily_push
      - name: Dead-man ping
        if: always()
        env:
          HC_PING_URLS: ${{ secrets.HC_PING_URLS }}
        run: |
          url=$(python3 -c "import json,os;print(json.loads(os.environ.get('HC_PING_URLS') or '{}').get('daily_analysis',''))" 2>/dev/null || true)
          if [ -n "$url" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              curl -fsS -m 10 --retry 3 "$url" || true
            else
              curl -fsS -m 10 --retry 3 "$url/fail" || true
            fi
          fi
