name: Daily Prediction Grader

on:
  # blueprint 22 Phase B: moved to arcemx-daily-grader.timer on the Oracle
  # box (2026-09-03) after diagnosing why GH's own schedule kept getting
  # cancelled at the 30min timeout even after every real code bug this repo
  # had was fixed (KNOWLEDGE_BASE.md sections 33/37/38/39) - a clean
  # unbuffered run here still took ~12s per graded analysis vs near-instant
  # on Oracle, a real network-path bottleneck to Yahoo Finance from GH's
  # shared runners, not a caching bug. See section 40. workflow_dispatch
  # stays as a manual recovery path.
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-embed historic prediction_scores rows (Phase 1 RAG one-shot)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force:
        description: "Force re-embed even rows already present (use after a model swap)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      re_embed_all:
        description: "Full re-embed + stamp feature_vector._embed_model (blueprint 14 one-shot; use instead of force to clear mixed-model contamination)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# See daily_analysis.yml for rationale on FORCE_JAVASCRIPT_ACTIONS_TO_NODE24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  grade:
    runs-on: ubuntu-latest
    # Root-caused 2026-08-31: a degraded/rate-limited yfinance path can hang
    # a single logical call for many minutes (not just a slow retry - a
    # real run stalled ~26min, a follow-up stalled ~51min before being
    # cancelled by hand, see KNOWLEDGE_BASE.md section 33). GH's own
    # default job ceiling is 360min with no cap here otherwise, unlike
    # alerts_checker.yml/backtest.yml/sensei_eod.yml which already set
    # this. 30min gives real headroom over normal operation while turning
    # a runaway hang into a bounded, dead-man-ping-triggering failure
    # instead of silent unbounded wall-clock.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-embed.txt') }}
      # HuggingFace model cache. Qwen3-Embedding-0.6B is ~1.2 GB;
      # without this cache every grader pass would re-download it,
      # eating ~2 GB egress and ~90 s wall clock. Keyed only on the
      # embed deps file so unrelated requirement bumps do not bust it.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements-embed.txt') }}
      - name: Install (analyzer + embed)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-embed.txt
      # -u (PYTHONUNBUFFERED): a 2026-09-03 cancelled run showed ZERO
      # stdout across the full 29min before the 30min timeout killed it -
      # Python block-buffers stdout on a non-TTY pipe, and a SIGTERM never
      # flushes that buffer, so a real hang and a buffering artifact look
      # identical in the log. This makes every run's actual progress
      # visible instead of guessing between "hanging" and "just quiet".
      - name: Grade past predictions + embed incremental
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u -m analyzer.grader
      # Was never wired into any scheduled job; stock_analyses rows sat
      # ungraded indefinitely, starving stock_analyst_llm's learning loop
      # of ground truth. Deterministic (yfinance-only, no LLM cost), same
      # env as the grader step above, so it rides this existing 17:00 IST
      # slot instead of a new workflow.
      - name: Grade matured Stock Analyst rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u -m analyzer.stock_analyst_grader
      # Manual backfill: triggers re-embedding when the workflow is
      # dispatched with backfill=true. Idempotent (embed_backfill skips
      # already-embedded analysis_id, dimension pairs unless --force).
      - name: Backfill prediction_embeddings (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.backfill == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ inputs.re_embed_all }}" = "true" ]; then
            python -m analyzer.embed_backfill --re-embed-all
          elif [ "${{ inputs.force }}" = "true" ]; then
            python -m analyzer.embed_backfill --force
          else
            python -m analyzer.embed_backfill
          fi
      - name: Dead-man ping
        if: always()
        env:
          HC_PING_URLS: ${{ secrets.HC_PING_URLS }}
        run: |
          url=$(python3 -c "import json,os;print(json.loads(os.environ.get('HC_PING_URLS') or '{}').get('daily_grader',''))" 2>/dev/null || true)
          if [ -n "$url" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              curl -fsS -m 10 --retry 3 "$url" || true
            else
              curl -fsS -m 10 --retry 3 "$url/fail" || true
            fi
          fi
