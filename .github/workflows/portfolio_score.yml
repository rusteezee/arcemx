name: Portfolio Scorecard LLM Enrichment

# On-demand, dispatched by web/app/api/portfolio-score-explain/route.ts
# (Netlify, not Render) the moment a user asks Sensei to enrich their
# Portfolio Scorecard. Same rationale as stock_analyst.yml - this used to
# run in-process on the Render bot, so a Render outage or blocked deploy
# took the feature down with zero warning.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "portfolio_score_runs row id to fill in"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run Portfolio Score LLM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m analyzer.portfolio_score_llm "${{ inputs.run_id }}"
