name: Watchdog

# Outage watchdog (bot/watchdog.py). Runs on GitHub, independent of the Oracle
# server, so it still alerts when that server is down: on 2026-10-26 the
# server died and nothing noticed for a week because every alert path lived
# on it. 06:17 UTC (11:47 IST) is after the India morning jobs; 13:37 UTC
# (19:07 IST) is after the 12:45 UTC US brief. Off the quarter-hour marks
# because GitHub's free cron skips congested slots.
on:
  schedule:
    - cron: "17 6 * * 1-5"
    - cron: "37 13 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install supabase requests python-dotenv
      - name: Check freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.watchdog
