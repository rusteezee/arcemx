name: Hourly News Fetch

on:
  # blueprint 22 Phase A: moved to arcemx-hourly-news.timer on the Oracle box
  # (2026-08-31). schedule: removed after confirming a real automatic fire
  # there and finding GH's own native cron had gone silent for hours on this
  # exact job that same morning. workflow_dispatch stays as a manual
  # recovery path.
  workflow_dispatch:

# See daily_analysis.yml for rationale on FORCE_JAVASCRIPT_ACTIONS_TO_NODE24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python -m fetchers.news
      - name: News alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.news_alerts
      - name: Dead-man ping
        if: always()
        env:
          HC_PING_URLS: ${{ secrets.HC_PING_URLS }}
        run: |
          url=$(python3 -c "import json,os;print(json.loads(os.environ.get('HC_PING_URLS') or '{}').get('hourly_news',''))" 2>/dev/null || true)
          if [ -n "$url" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              curl -fsS -m 10 --retry 3 "$url" || true
            else
              curl -fsS -m 10 --retry 3 "$url/fail" || true
            fi
          fi
