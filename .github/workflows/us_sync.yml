name: US Holdings Sync

# INDmoney US holdings, before the US brief and after the close. Kept an hour away from the other INDmoney jobs so two runs never refresh the same token at once.
# Moved here 2026-11-03 after the Oracle server was deleted on 26/10.
on:
  schedule:
    - cron: "50 11 * * 1-5"
    - cron: "33 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: us_sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run us.holdings_sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARCEMX_NO_BROWSER: "1"
        run: python -u -m us.holdings_sync
